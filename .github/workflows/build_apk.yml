name: Build APK 🤖
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nom du projet"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java (Temurin — stable avec Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dépendances npm
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: npm install

      - name: Build Vite (production)
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: npm run build

      - name: Intégration Capacitor v6
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init KirovApp com.kirov.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 🧹 Purge cache Gradle corrompu (Fix bcprov JAR)
        run: |
          rm -rf ~/.gradle/caches/jars-*
          rm -rf ~/.gradle/caches/modules-*
          rm -rf ~/.gradle/caches/transforms-*

      - name: Compilation APK Debug
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}/android
        run: ./gradlew assembleDebug --no-daemon --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}_APK
          path: PROJECTS/${{ github.event.inputs.project_name }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
