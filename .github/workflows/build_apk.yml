name: Build APK 🤖
on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Nom du projet"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dépendances
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: npm install

      - name: Build Vite
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: npm run build

      - name: Ajout de Capacitor
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init KirovApp com.kirov.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Compilation de l'APK
        working-directory: PROJECTS/${{ github.event.inputs.project_name }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.project_name }}_APK
          path: PROJECTS/${{ github.event.inputs.project_name }}/android/app/build/outputs/apk/debug/app-debug.apk
